<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dedavi Travels</title>
  <meta name="description" content="Interactive globe of every place I've visited, with stats by country and region.">
  <meta name="theme-color" content="#0a0f1d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23111a2e' stroke='%23f2b544' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f2b544'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/globe" aria-label="Dedavi Travels, home">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Dedavi <strong>Travels</strong></span>
      </a>
      <nav class="tabs" aria-label="Sections">
        <a class="tab" href="#/globe" data-route="globe">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>
          <span>Globe</span>
        </a>
        <a class="tab" href="#/stats" data-route="stats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
          <span>Stats</span>
        </a>
        <a class="tab" href="#/about" data-route="about">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
          <span>About</span>
        </a>
      </nav>
    </header>

    <main class="views">
      <div class="state" id="state-loading">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading the map…</p>
      </div>
      <div class="state" id="state-error" hidden>
        <p class="state-title">Couldn't load the travel data</p>
        <p class="muted">Please check your connection and try again.</p>
        <button class="btn" type="button" id="retry">Try again</button>
      </div>

      <section class="view view-globe" id="view-globe" hidden>
        <div class="map" id="map"></div>
        <button class="map-toggle" type="button" id="projection-toggle"></button>
        <div class="map-tooltip" id="map-tooltip" hidden></div>
      </section>
      <section class="view view-scroll" id="view-stats" hidden></section>
      <section class="view view-scroll" id="view-about" hidden></section>
    </main>

    <footer class="footer">
      <span>Dedavi Travels</span>
      <span class="footer-sep" aria-hidden="true">·</span>
      <span id="footer-version"></span>
    </footer>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="assets/js/version.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/globe.js"></script>
  <script src="assets/js/stats.js"></script>
  <script src="assets/js/about.js"></script>
  <script>DT.start();</script>
</body>
</html>
